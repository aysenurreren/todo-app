version: "3.9"

services:

  # ── Nginx ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: todo_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - todo_net

  # ── Backend Replicas ───────────────────────────────────────────
  backend1:
    build: ./backend
    container_name: todo_backend_1
    environment:
      - INSTANCE_ID=1
      - DATABASE_URL=postgresql://todo_user:todo_pass@postgres:5432/todo_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USER=${GMAIL_USER}     
      - GMAIL_PASS=${GMAIL_PASS} 
      - FRONTEND_URL=${FRONTEND_URL}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - LOG_SERVICE_URL=http://log-service:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo_net

  backend2:
    build: ./backend
    container_name: todo_backend_2
    environment:
      - INSTANCE_ID=2
      - DATABASE_URL=postgresql://todo_user:todo_pass@postgres:5432/todo_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USER=${GMAIL_USER}     
      - GMAIL_PASS=${GMAIL_PASS} 
      - FRONTEND_URL=${FRONTEND_URL}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - LOG_SERVICE_URL=http://log-service:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo_net

  backend3:
    build: ./backend
    container_name: todo_backend_3
    environment:
      - INSTANCE_ID=3
      - DATABASE_URL=postgresql://todo_user:todo_pass@postgres:5432/todo_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - GMAIL_USER=${GMAIL_USER}     
      - GMAIL_PASS=${GMAIL_PASS} 
      - FRONTEND_URL=${FRONTEND_URL}
      - REFRESH_SECRET=${REFRESH_SECRET}
      - LOG_SERVICE_URL=http://log-service:5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - todo_net

  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    environment:
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_pass
      - POSTGRES_DB=todo_db
    volumes:
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # ← bunu ekle
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_net

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: todo_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_net

  # ── Log PostgreSQL ─────────────────────────────────────────────
  log-postgres:
    image: postgres:16-alpine
    container_name: todo_log_postgres
    environment:
      - POSTGRES_USER=log_user
      - POSTGRES_PASSWORD=log_pass
      - POSTGRES_DB=log_db
    volumes:
      - ./log-service/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - log_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U log_user -d log_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - todo_net

  # ── Log Service ────────────────────────────────────────────────
  log-service:
    build: ./log-service
    container_name: todo_log_service
    environment:
      - PORT=5001
      - LOG_DATABASE_URL=postgresql://log_user:log_pass@log-postgres:5432/log_db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      log-postgres:
        condition: service_healthy
    networks:
      - todo_net

networks:
  todo_net:
    driver: bridge
    
volumes:
  postgres_data:
  log_postgres_data: